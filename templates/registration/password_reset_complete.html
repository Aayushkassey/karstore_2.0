{% extends 'pages/base.html' %}
{% block content %}
<style>
    .success-card {
        max-width: 500px;
        margin: 80px auto;
        padding: 40px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
        font-family: 'Segoe UI', sans-serif;
    }
    .success-icon {
        font-size: 60px; color: #27ae60; margin-bottom: 20px;
    }
    .success-card h2 { color: #2c3e50; margin-bottom: 15px; }
    .login-btn {
        display: inline-block; padding: 12px 30px; background: #ff6b00; color: white;
        text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px;
    }
</style>

<div class="success-card">
    <div class="success-icon">✅</div>
    <h2>Password Updated!</h2>
    <p>Your password has been changed successfully. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="login-btn">Login to KAR Store</a>
</div>
{% endblock %}
