{% extends 'pages/base.html' %}
{% block content %}
<style>
    .message-card {
        max-width: 500px;
        margin: 80px auto;
        padding: 40px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
        font-family: 'Segoe UI', sans-serif;
    }
    .icon-circle {
        width: 80px; height: 80px; background: #e8f4fd; color: #3498db;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px; font-size: 40px;
    }
    .message-card h2 { color: #2c3e50; margin-bottom: 15px; }
    .message-card p { color: #666; line-height: 1.6; }
</style>

<div class="message-card">
    <div class="icon-circle">📩</div>
    <h2>Check Your Email</h2>
    <p>We've sent a password reset link to your email. If it doesn't appear soon, check your spam folder.</p>
    <a href="{% url 'login' %}" style="color: #ff6b00; text-decoration: none; font-weight: bold;">Back to Login</a>
</div>
{% endblock %}
