{% extends 'pages/base.html' %}

{% block content %}
<style>
    .reset-card {
        max-width: 450px;
        margin: 80px auto;
        padding: 30px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
    }
    .reset-card h3 { color: #333; margin-bottom: 10px; }
    .reset-card p { color: #666; font-size: 14px; margin-bottom: 25px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
    .form-group input { 
        width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; 
    }
    .reset-btn {
        width: 100%; padding: 12px; background: #ff6b00; color: white; border: none; 
        border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s;
    }
    .reset-btn:hover { background: #e66000; }
</style>

<div class="reset-card">
    <h3>Reset Password</h3>
    <p>Enter your email and we'll send you a secure link to reset your password.</p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" name="email" placeholder="example@gmail.com" required>
        </div>
        <button type="submit" class="reset-btn">Send Reset Link</button>
    </form>
</div>
{% endblock %}
