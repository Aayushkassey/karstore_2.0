{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>KAR Store</title>
    <link rel="icon" type="image/png" href="{% static 'image/logo.png' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/base.css' %}">
    
    {% block extra_head %}
    {% endblock %}
    
</head>
<body>
    {% include 'components/navbar.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'components/footer.html' %}

   <script>
// 1. GLOBAL FUNCTIONS (Bahira bata call garna milne)
function addToCart(productId) {
    // Event stop garchha jasle garda card click ra button click clash hudaina
    if (window.event) window.event.stopPropagation();

    console.log("Adding product ID:", productId);

    fetch(`/orders/add-to-cart/${productId}/`, {
        method: 'GET',
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
        }
    })
    .then(response => {
        if (response.status === 401) {
            alert("Please login to add items to cart.");
            window.location.href = "{% url 'login' %}";
            return;
        }
        return response.json();
    })
    .then(data => {
        if (data && data.status === 'success') {
            alert("Product added to cart! ✅");
            location.reload(); 
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
}

// Modal ko lagi function
function addToCartFromModal() {
    if (typeof currentProductId !== 'undefined' && currentProductId) {
        addToCart(currentProductId);
        closeModal();
    }
}

// 2. DOM CONTENT LOADED (Search logic ko lagi)
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.querySelector('input[name="q"]');
    const suggestionBox = document.getElementById('suggestion-box');

    if (searchInput && suggestionBox) {
        searchInput.addEventListener('input', function() {
            const term = this.value.trim();
            if (term.length < 1) {
                suggestionBox.style.display = 'none';
                return;
            }

            fetch(`/search-suggestions/?term=${term}`)
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        suggestionBox.innerHTML = '';
                        data.forEach(name => {
                            const div = document.createElement('div');
                            div.classList.add('suggestion-item');
                            div.innerHTML = `<span style="opacity: 0.5; margin-right: 10px;">🔍</span> ${name}`;
                            div.addEventListener('click', () => {
                                searchInput.value = name;
                                suggestionBox.style.display = 'none';
                                searchInput.closest('form').submit();
                            });
                            suggestionBox.appendChild(div);
                        });
                        suggestionBox.style.display = 'block';
                    } else {
                        suggestionBox.style.display = 'none';
                    }
                })
                .catch(err => console.error("Search error:", err));
        });

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !suggestionBox.contains(e.target)) {
                suggestionBox.style.display = 'none';
            }
        });
    }
});
</script>

</body>
</html>
