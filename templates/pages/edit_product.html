{% extends 'pages/base.html' %}
{% load static %}

{% block content %}
<style>
    .edit-page-wrapper {
        background-color: #fdfdfd;
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }
    .edit-card {
        width: 100%;
        max-width: 800px;
        background: #fff;
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.06);
        border: none;
        overflow: hidden;
    }
    .edit-header { text-align: center; padding: 40px 40px 20px 40px; }
    .edit-header h2 { font-weight: 800; color: #222; margin-bottom: 10px; }
    .form-section { padding: 0 50px 50px 50px; }
    .form-group { margin-bottom: 25px; }
    .form-label { font-weight: 600; color: #444; font-size: 14px; margin-bottom: 8px; display: block; }
    .form-input { width: 100%; padding: 12px 18px; border: 1px solid #eee; border-radius: 12px; background: #fcfcfc; transition: all 0.3s ease; font-family: inherit; }
    .form-input:focus { border-color: #f85606; background: #fff; outline: none; box-shadow: 0 5px 15px rgba(248, 86, 6, 0.05); }
    
    /* Description Textarea */
    .form-textarea { min-height: 120px; resize: vertical; }

    .image-preview-container { display: flex; flex-direction: column; align-items: center; background: #fafafa; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px dashed #ddd; }
    .current-img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    
    .btn-save { width: 100%; padding: 16px; background: #f85606; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 16px; }
    .btn-save:hover { background: #d04605; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(248, 86, 6, 0.2); }
    .back-btn { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 14px; }
</style>

<div class="edit-page-wrapper">
    <div class="edit-card">
        <div class="edit-header">
            <h2>Edit Product</h2>
            <p style="color: #888;">Update your product inventory details</p>
        </div>

        <div class="form-section">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-input" value="{{ product.name }}" required>
                </div>

                <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                    <div style="flex: 1;">
                        <label class="form-label">Category</label>
                        <select name="category" id="category-select" class="form-input" onchange="checkNewCategory(this)">
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cat.id == product.category.id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                            <option value="new_category" style="color: #f85606; font-weight: bold;">+ Add New Category</option>
                        </select>

                        <div id="new-category-input" style="display: none; margin-top: 10px;">
                            <input type="text" name="new_category_name" class="form-input" placeholder="Enter new category name">
                        </div>
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Brand Name</label>
                        <input type="text" name="brand" class="form-input" value="{{ product.brand }}">
                    </div>
                </div>

                <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                    <div style="flex: 1;">
                        <label class="form-label">Price (Rs.)</label>
                        <input type="number" name="price" class="form-input" value="{{ product.price }}" step="0.01" required>
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Discount (%)</label>
                        <input type="number" name="discount_percentage" class="form-input" value="{{ product.discount_percentage|default:0 }}" min="0" max="100" step="0.1">
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Stock Qty</label>
                        <input type="number" name="stock" class="form-input" value="{{ product.stock }}" required>
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">SKU</label>
                        <input type="text" name="sku" class="form-input" value="{{ product.sku }}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Product Description</label>
                    <textarea name="description" class="form-input form-textarea" placeholder="Write something about your product..." required>{{ product.description }}</textarea>
                </div>

                <div class="image-preview-container">
                    <p style="font-size: 11px; font-weight: 700; color: #bbb; margin-bottom: 10px; letter-spacing: 1px;">CURRENT IMAGE</p>
                    {% if product.image %}
                        <img src="{{ product.display_image }}" class="current-img">
                    {% endif %}
                    <input type="file" name="image" class="form-input" style="background: none; border: none; padding: 0; font-size: 12px; text-align: center;">
                </div>

                <button type="submit" class="btn-save">Update Product Details</button>
                
                <a href="{% url 'dashboard' %}" class="back-btn">← Back to Dashboard</a>
            </form>
        </div>
    </div>
</div>

<script>
function checkNewCategory(select) {
    const newCatInput = document.getElementById('new-category-input');
    const inputField = newCatInput.querySelector('input');
    
    if (select.value === 'new_category') {
        newCatInput.style.display = 'block';
        inputField.required = true;
        inputField.focus();
    } else {
        newCatInput.style.display = 'none';
        inputField.required = false;
    }
}
</script>

{% endblock %}
