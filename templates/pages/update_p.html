{% extends 'pages/base.html' %} 
{% load static %} 
{% block content %}
<div
  class="update-profile-wrapper"
  style="background-color: #f4f4f4; padding: 50px 0; min-height: 80vh"
>
  <div
    class="container"
    style="
      max-width: 600px;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      margin: 0 auto;
    "
  >
    <div class="form-header" style="text-align: center; margin-bottom: 30px">
      <h2 style="color: #333; font-weight: 700">Update Profile</h2>
      <p style="color: #777">Keep your information up to date</p>
    </div>

    <form method="POST" class="profile-form">
      {% csrf_token %} {% for field in form %}
      <div class="form-group" style="margin-bottom: 20px">
        <label
          style="
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
          "
        >
          {{ field.label }}
        </label>
        {{ field }} {% if field.errors %}
        <small style="color: #d9534f">{{ field.errors|first }}</small>
        {% endif %}
      </div>
      {% endfor %}

      <div class="button-group" style="margin-top: 30px">
        <button
          type="submit"
          style="
            width: 100%;
            background-color: #f85606;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
          "
        >
          Save Changes
        </button>

        <a
          href="{% url 'home' %}"
          style="
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
            font-size: 14px;
          "
        >
          Cancel and Go Back
        </a>
      </div>
    </form>
  </div>
</div>

<style>
  /* Form fields lai professional look dina */
  .profile-form input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
    outline: none;
  }

  .profile-form input:focus {
    border-color: #f85606;
    box-shadow: 0 0 5px rgba(248, 86, 6, 0.2);
  }

  .profile-form input[readonly] {
    background-color: #f9f9f9;
    cursor: not-allowed;
    color: #888;
  }

  button:hover {
    background-color: #d44d05 !important;
  }
</style>
{% endblock %}
