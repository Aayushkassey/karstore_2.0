{% extends 'pages/base.html' %}
{% load static %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Login</h2>

        {% if error %}
            <div class="error_message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" class="auth-field" placeholder="Email Address" required>
            <input type="password" name="password" class="auth-field" placeholder="Password" required autocomplete="new-password">
            
            <button type="submit" class="auth-btn">Login</button>

            <div class="form-footer">
                Don't have an account? <a href="{% url 'register' %}">Register here</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
