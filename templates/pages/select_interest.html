{% extends 'pages/base.html' %}
{% load static %}

{% block content %}
       <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }

        .interest-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        /* टाइटल र स्किप बटनलाई एउटै लाइनमा मिलाउने */
        .header-row {
            display: flex;
            justify-content: space-between; /* एउटा बायाँ, अर्को दायाँ */
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .title-text {
            font-size: 22px;
            font-weight: 700;
            color: #2d3436;
        }

        .btn-skip {
            padding: 8px 18px;
            background-color: #f71b1b;
            color: #252525;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }

        .btn-skip:hover {
            background-color: #0080ff;
            color: #2d3436;
            transform: translateY(-1px);
        }

        .interests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .interest-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 15px;
            background: #ffffff;
            border: 2px solid #f1f3f5;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .interest-item:hover {
            border-color: #007bff;
            background: #f8fbff;
        }

        .interest-item input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Checkbox सेलेक्ट हुँदाको स्टाइल */
        .interest-item input:checked + span {
            font-weight: 600;
            color: #007bff;
        }

        .interest-item input:checked {
            accent-color: #007bff;
        }

        .action-row {
            text-align: center;
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-save:hover {
            background-color: #6157e7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header-row {
                flex-direction: row;
                text-align: left;
            }
            .title-text {
                font-size: 18px;
            }
        }
    </style>

<div class="interest-container">
    <div class="header-row">
        <span class="title-text">Select Your Interests</span>
        <a href="{% url 'skip_interests' %}" class="btn-skip">Skip</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="interests-grid">
            {% for interest in interests %}
            <label class="interest-item">
                <input type="checkbox" name="interests" value="{{ interest.id }}">
                <span>{{ interest.name }}</span>
            </label>
            {% empty %}
            <p style="color: #999;">No interests available.</p>
            {% endfor %}
        </div>
        
        <div class="action-row">
            <button type="submit" class="btn-save">Save</button>
        </div>
    </form>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
    
        const checkboxes = document.querySelectorAll('input[name="interests"]:checked');
        
    
        if (checkboxes.length === 0) {
            e.preventDefault(); 
            

            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: 'Selection Required',
                    text: 'Please select at least one interest before saving, or click Skip.',
                    icon: 'warning',
                    background: '#ffffff',
                    confirmButtonColor: '#007bff'
                });
            } else {
                // यदि SweetAlert छैन भने साधारण alert
                alert("Please select at least one interest before saving.");
            }
        }
    });

// page load only then add event listeners to links
    document.addEventListener('DOMContentLoaded', function() {
        // if the user tries to click any link without selecting interests, show an alert
        const allLinks = document.querySelectorAll('a');

        allLinks.forEach(link => {
            link.addEventListener('click', function(e) {
            
                // if (!this.classList.contains('btn-skip')) and 
                //!this.closest('.interest-container') checks if the clicked link is not the skip button 
                //and is not inside the interest container
                if (!this.classList.contains('btn-skip') && !this.closest('.interest-container')) {
                    e.preventDefault(); // blocking the default action of the link
                    
                    Swal.fire({
                        title: 'Action Required',
                        text: 'Please select your interests or click "Skip" to continue to the store.',
                        icon: 'info',
                        background: '#ffffff',
                        confirmButtonColor: '#007bff',
                        width: '400px',
                        padding: '1rem',
                        customClass: {
                            popup: 'small-alert-popup',
                            title: 'small-alert-title',
                            confirmButton: 'small-alert-button'
                        }
                    });
                }
            });
        });
    });

</script>
{% endblock %}
