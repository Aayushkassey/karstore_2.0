<style>
    #productModal {
        z-index: 100000 !important;
    }
    .modal-content-container {
        max-width: 750px !important; /* Size fixed for pop-up look */
        width: 90%;
        background: white;
        padding: 30px;
        border-radius: 15px;
        display: flex;
        gap: 25px;
        flex-wrap: wrap;
        position: relative;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    #modalCartBtn {
        z-index: 100001 !important;
        cursor: pointer !important;
        background: #f85606;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-weight: 700;
        width: 100%;
        transition: 0.3s;
    }
    #modalCartBtn:hover { background: #d44a05; }
</style>

<div id="productModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); align-items:center; justify-content:center;">
    <div class="modal-content-container">
        <span onclick="closeModal()" style="position:absolute; top:10px; right:20px; font-size:30px; cursor:pointer; color:#888;">&times;</span>
        
        <div style="flex:1; min-width: 280px;">
            <img id="modalImg" src="" alt="" style="width:100%; height:320px; object-fit:contain; background:#f9f9f9; border-radius:10px;">
        </div>
        
        <div style="flex:1; min-width: 280px; display: flex; flex-direction: column;">
            <h2 id="modalTitle" style="color:#222; margin: 0 0 10px 0; font-size: 24px;"></h2>
            <h3 id="modalPrice" style="color:#f85606; font-size:26px; margin: 10px 0;"></h3>
            <p id="modalDesc" style="color:#666; font-size:14px; line-height:1.6; margin-bottom:20px; overflow-y: auto; max-height: 120px;"></p>
            
            <button id="modalCartBtn" onclick="sendToCartFromModal(event)">
                ADD TO CART
            </button>
        </div>
    </div>
</div>

<script>
let currentModalProductId = null;

function showProduct(event, name, img, price, desc, id) {
    if (event) {
        event.preventDefault(); 
        event.stopPropagation();
    }
    document.getElementById('modalTitle').innerText = name;
    document.getElementById('modalImg').src = img;
    document.getElementById('modalPrice').innerText = "Rs. " + parseFloat(price).toFixed(2);
    document.getElementById('modalDesc').innerText = desc;
    currentModalProductId = id; 
    
    document.getElementById('productModal').style.display = 'flex';
    document.body.style.overflow = 'hidden'; 
}

function closeModal() {
    document.getElementById('productModal').style.display = 'none';
    document.body.style.overflow = 'auto';
}

function sendToCartFromModal(event) {
    if (event) event.stopPropagation();
    if (!currentModalProductId) return;

    // Direct AJAX call from modal to ensure it works
    fetch(`/orders/add-to-cart/${currentModalProductId}/`, {
        method: 'POST',
        headers: { 
            'X-CSRFToken': '{{ csrf_token }}', 
            'X-Requested-With': 'XMLHttpRequest' 
        }
    })
    .then(r => r.json())
    .then(data => { 
        if (data.status === 'success') {
            alert("Added to cart!");
            const cartElement = document.getElementById('cart-count');
            if (cartElement) {
                cartElement.innerText = `(${data.cart_count})`;
            }
            closeModal();
        } else if (data.status === 'login_required') {
            window.location.href = "{% url 'login' %}";
        }
    })
    .catch(e => console.error("Error:", e));
}

// Background click to close
window.onclick = function(event) {
    let modal = document.getElementById('productModal');
    if (event.target == modal) closeModal();
};
</script>
