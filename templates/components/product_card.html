{% load static %}

<div class="product-card" id="product-card-{{ product.id }}" 
     style="background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; height: 100%; position: relative;">
    
    <div class="img-wrapper" 
         onclick="handleViewDetails(event, '{{ product.name|escapejs }}', '{% if product.image %}{{ product.image.url }}{% endif %}', '{{ product.price|floatformat:2 }}', '{{ product.description|escapejs }}', '{{ product.id }}')"
         style="position: relative; padding: 15px; background: #fff; height: 200px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        
        <div class="whistle-indicator" 
             onclick="handleWhistleClick(event, '{{ product.id }}')"
             style="position: absolute; top: 10px; right: 10px; z-index: 20; background: rgba(255, 255, 255, 0.95); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;">
            <span class="heart-emoji-{{ product.id }}" style="font-size: 20px; pointer-events: none;">
                {% if product.is_whistle %}❤️{% else %}🤍{% endif %}
            </span>
        </div>

        <img src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'image/logo.png' %}{% endif %}" 
             style="max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none;">
        
        <span style="position: absolute; bottom: 10px; left: 10px; background: #f85606; color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 700;">
            Rs. {{ product.price|floatformat:0 }}
        </span>
    </div>

    <div class="product-details" style="padding: 15px; flex-grow: 1; display: flex; flex-direction: column;">
        <p style="font-size: 10px; color: #f85606; text-transform: uppercase; font-weight: 700; margin-bottom: 5px;">{{ product.category.name }}</p>
        <h3 style="font-size: 14px; font-weight: 500; color: #333; margin: 0 0 15px; height: 40px; overflow: hidden;">{{ product.name|truncatechars:45 }}</h3>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button type="button" 
                    onclick="handleViewDetails(event, '{{ product.name|escapejs }}', '{% if product.image %}{{ product.image.url }}{% endif %}', '{{ product.price|floatformat:2 }}', '{{ product.description|escapejs }}', '{{ product.id }}')"
                    style="width: 100%; padding: 8px; border: 1.5px solid #f85606; background: transparent; color: #f85606; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 11px; text-transform: uppercase;">
                View Details
            </button>

            <button type="button" onclick="handleAddToCart(event, '{{ product.id }}')" 
                    style="width: 100%; padding: 10px; border: none; background: #f85606; color: #fff; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 11px; text-transform: uppercase;">
                Add to Cart
            </button>
        </div>
    </div>
</div>

<script>
// 1. View Details handle garne ra Activity Log garne
function handleViewDetails(event, name, image, price, description, productId) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    // Server lai activity log garna request pathaune
    fetch(`/log-product-view/${productId}/`, {
        method: 'GET',
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(response => response.json())
    .then(data => console.log("Log Status:", data))
    .catch(err => console.error("Logging error:", err));

    // Timro existing modal function call garne (yadi chha bhane)
    if (typeof showProduct === "function") {
        showProduct(event, name, image, price, description, productId);
    }
}

// 2. Whistle (Heart) Toggle
function handleWhistleClick(event, productId) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }
    fetch(`/orders/toggle-whistle/${productId}/`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') {
            document.querySelectorAll(`.heart-emoji-${productId}`).forEach(h => h.innerHTML = data.is_whistle ? '❤️' : '🤍');
        }
    });
}

// 3. Add to Cart
function handleAddToCart(event, productId) {
    if (event) { event.preventDefault(); event.stopPropagation(); }
    fetch(`/orders/add-to-cart/${productId}/`, {
        method: 'POST',
        headers: { 
            'X-CSRFToken': '{{ csrf_token }}', 
            'X-Requested-With': 'XMLHttpRequest' 
        }
    })
    .then(r => r.json())
    .then(data => { 
        if (data.status === 'success') alert("Product added to cart! ✅"); 
    });
}
</script>
